<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <title>Earth AR</title>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <!-- ポスター -->
  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <!-- ロケット -->
    <a-entity id="rocket">

      <a-entity
        gltf-model="./rocket-optimized.glb"
        position="0 0 0"
        scale="1 1 1">
      </a-entity>

    </a-entity>

  </a-entity>

</a-scene>


<script>

const target = document.querySelector('#target');
const rocket = document.querySelector('#rocket');

let launching = false;
let timer = null;


/* =========================
   ロケットを1回発射
========================= */

function launchRocket() {

  // ロケットをスタート位置へ
  rocket.setAttribute(
    "position",
    "0 0 0"
  );

  // 前回のアニメーションを削除
  rocket.removeAttribute("animation");

  // ブラウザに変更を反映させるため少し待つ
  setTimeout(() => {

    rocket.setAttribute(
      "animation",
      "property: position;" +
      "from: 0 0 0;" +
      "to: 0 4 0;" +
      "dur: 3000;" +
      "easing: easeInQuad;"
    );

  }, 50);

}


/* =========================
   連続発射
========================= */

function startLaunching() {

  if (launching) return;

  launching = true;

  // まず1発
  launchRocket();

  // 4秒ごとに次のロケット
  timer = setInterval(() => {

    launchRocket();

  }, 4000);

}


/* =========================
   停止
========================= */

function stopLaunching() {

  launching = false;

  if (timer) {

    clearInterval(timer);
    timer = null;

  }

  rocket.removeAttribute("animation");

  rocket.setAttribute(
    "position",
    "0 0 0"
  );

}


/* =========================
   ポスターを発見
========================= */

target.addEventListener("targetFound", () => {

  console.log("TARGET FOUND!");

  startLaunching();

});


/* =========================
   ポスターを見失った
========================= */

target.addEventListener("targetLost", () => {

  console.log("TARGET LOST!");

  stopLaunching();

});

</script>

</body>
</html>
