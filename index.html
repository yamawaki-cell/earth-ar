<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <title>Earth AR</title>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- ポスターを認識したらここが表示される -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- ロケット全体 -->
    <a-entity
      animation="property: position; from: 0 0 0; to: 0 4 0; dur: 3000; easing: easeInQuad;">

      <!-- ロケット本体 -->
      <a-cylinder
        position="0 0.4 0"
        radius="0.15"
        height="0.7"
        color="white">
      </a-cylinder>

      <!-- ロケットの先端 -->
      <a-cone
        position="0 0.85 0"
        radius-bottom="0.15"
        radius-top="0"
        height="0.3"
        color="red">
      </a-cone>

      <!-- 左の翼 -->
      <a-box
        position="-0.18 0.2 0"
        width="0.12"
        height="0.3"
        depth="0.08"
        rotation="0 0 -25"
        color="red">
      </a-box>

      <!-- 右の翼 -->
      <a-box
        position="0.18 0.2 0"
        width="0.12"
        height="0.3"
        depth="0.08"
        rotation="0 0 25"
        color="red">
      </a-box>

      <!-- 炎 -->
      <a-cone
        position="0 -0.05 0"
        radius-bottom="0.10"
        radius-top="0"
        height="0.3"
        color="orange"
        rotation="180 0 0">
      </a-cone>

    </a-entity>

  </a-entity>

</a-scene>

</body>
</html>
