<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポケベルシミュレータ</title>

<style>
body{
    background:#111;
    color:#00ff66;
    font-family: monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.pager{
    background:#222;
    border:4px solid #555;
    border-radius:20px;
    padding:30px;
    width:360px;
    box-shadow:0 0 30px #000;
}

.screen{
    background:#99ff99;
    color:#003300;
    padding:20px;
    height:120px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:24px;
    overflow:auto;
}

input{
    width:100%;
    padding:12px;
    font-size:22px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    font-size:20px;
    background:#00aa44;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#00cc55;
}

.small{
    margin-top:15px;
    font-size:14px;
    color:#aaa;
}
</style>
</head>
<body>

<div class="pager">
    <div class="screen" id="screen">
        READY...
    </div>

    <input type="text" id="codeInput" placeholder="数字を入力">
    <button onclick="decode()">送信</button>

    <div class="small">
        例: 0840 / 4649 / 14106 / 724106
    </div>
</div>

<script>

const pagerCodes = {
    "0840": "おはよう",
    "4649": "よろしく",
    "14106": "愛してる",
    "724106": "何してる",
    "999": "SOS",
    "3341": "さみしい",
    "3470": "さよなら",
    "11014": "会いたい",
    "5963": "ご苦労さん",
    "0906": "遅れる",
    "88919": "早く行く"
};

function beep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = "square";
    osc.frequency.setValueAtTime(1200, ctx.currentTime);

    osc.connect(ctx.destination);
    osc.start();

    setTimeout(() => {
        osc.stop();
    }, 150);
}

function decode() {
    const input = document.getElementById("codeInput").value;
    const screen = document.getElementById("screen");

    beep();

    if (pagerCodes[input]) {
        screen.innerHTML =
            "受信中...\n\n" +
            input + "\n→ " +
            pagerCodes[input];
    } else {
        screen.innerHTML =
            "受信中...\n\n" +
            input + "\n→ 未登録コード";
    }
}

</script>

</body>
</html>
